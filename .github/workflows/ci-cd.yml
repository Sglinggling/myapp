name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/myapp

jobs:
  unit-tests:
    name: 1) Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -v

  e2e-tests:
    name: 2) E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build et démarrage du conteneur
        run: |
          docker build -t myapp:test .
          docker run -d --name myapp-test -p 8016:8016 myapp:test
          for i in $(seq 1 20); do
            curl -sf http://localhost:8016/health && break
            sleep 1
          done
      - run: pytest tests/e2e -v
        env:
          BASE_URL: http://localhost:8016
      - name: Logs du conteneur (si échec)
        if: failure()
        run: docker logs myapp-test

  build-push:
    name: 3-4) Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: 5-6) Deploy Azure VM + healthcheck
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
            sudo docker pull $IMAGE
            # Idempotent : on supprime l'ancien conteneur s'il existe, puis on relance avec le même nom
            sudo docker rm -f myapp || true
            sudo docker run -d --name myapp --restart unless-stopped -p 8016:8016 $IMAGE
            sudo docker image prune -f
            for i in $(seq 1 20); do
              curl -sf http://localhost:8016/health && exit 0
              sleep 2
            done
            echo "Healthcheck KO sur la VM" && sudo docker logs myapp && exit 1

      - name: Vérification depuis l'extérieur (IP publique)
        run: |
          for i in $(seq 1 10); do
            curl -sf http://${{ secrets.VM_HOST }}:8016/health && exit 0
            sleep 3
          done
          echo "L'application ne répond pas sur l'IP publique" && exit 1
